; PHP for Turnkeeper. setup.sh fills in {{…}} and installs it as /etc/php/{{PHP}}/fpm/pool.d/turnkeeper.conf.
; Runs as the app's own user (so it can write storage/), and only Caddy can use its socket.
[turnkeeper]
user = {{APP_USER}}
group = {{APP_USER}}
listen = /run/php/turnkeeper.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

; Plenty for a test group on the smallest server; raise max_children if pages queue up.
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
